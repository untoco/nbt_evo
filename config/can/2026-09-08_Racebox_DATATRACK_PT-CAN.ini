# DataTrack configuration prepared 2026-09-08 for BMW F21 N13B16 PT-CAN.
# Status: planned. Derived from the owner's exported Racebox.ini; the four
# WHEEL_* decoders and RaceChrono packet 0x03 require validation on this car.

[GENERAL]
# 50 Hz is a requested maximum, not a guaranteed achieved rate under load.
LOGGER: state=ON, max_rate=50, trigger=BUTTON, log_format=CSV
GPS: state=OFF, rate=16, log=ON
TONE: state=ON
BLE: state=ON, protocol=Racechrono_DIY
TIME: offset=3

[CAN]
CAN1: state=ON, speed=500, mode=NORM, filter_hex=[], log=ON, log_format=ASC
CAN2: state=OFF

[ADC]
A1: state=OFF, type=ANALOG_12V, log=ON
A2: state=OFF, type=ANALOG_12V, log=ON
A3: state=OFF, type=ANALOG_12V, log=ON
A4: state=OFF, type=ANALOG_12V, log=ON
D1: state=ON, type=DS_GND, log=ON
D2: state=ON, type=DS_GND, log=ON
D3: state=OFF, type=DS_GND, log=OFF

[PARAM]
RPM: src=CAN1, id=A5, bit=40, size=16, byte_order=LE, data_type=UINT, scale=0.25, offset=0, range_min=0, range_max=8000, param_type=FLOAT, unit="min-1", log=ON
THROTTLE: src=CAN1, id=D9, bit=16, size=12, byte_order=LE, data_type=UINT, scale=0.025, offset=0, range_min=0, range_max=100, param_type=FLOAT, unit="per", log=ON
GEAR: src=CAN1, id=F3, bit=40, size=4, byte_order=LE, data_type=UINT, scale=1, offset=-4, range_min=-3, range_max=8, param_type=INT, unit="", log=ON
BATTERY: src=CAN1, id=281, bit=0, size=12, byte_order=LE, data_type=UINT, scale=0.015, offset=0, range_min=0, range_max=60, param_type=FLOAT, unit="V", log=ON
AIR_TEMP: src=CAN1, id=2CA, bit=8, size=8, byte_order=LE, data_type=UINT, scale=0.5, offset=-40, range_min=-40, range_max=85, param_type=FLOAT, unit="degC", log=ON
SW_ANGLE: src=CAN1, id=301, bit=16, size=16, byte_order=LE, data_type=UINT, scale=0.05, offset=-1638.4, range_min=-1440.11, range_max=1440.11, param_type=FLOAT, unit="deg", log=ON
COOLANT_TEMP: src=CAN1, id=3F9, bit=32, size=8, byte_order=LE, data_type=UINT, scale=1, offset=-40, range_min=-40, range_max=170, param_type=FLOAT, unit="degC", log=ON
OIL_TEMP: src=CAN1, id=3F9, bit=40, size=8, byte_order=LE, data_type=UINT, scale=1, offset=-48, range_min=-48, range_max=144, param_type=FLOAT, unit="degC", log=ON
# BRAKE_PED is a discrete pedal/brake-light switch, not pedal travel or percentage.
BRAKE_PED: src=CAN1, id=173, bit=52, size=4, byte_order=LE, data_type=BOOL, scale=1, offset=0, range_min=0, range_max=1, param_type=ON_OFF, unit="", log=ON
# 0…200 bar is a display/sanity envelope for hydraulic pressure, not a verified
# F21 sensor limit; retain raw ASC so unexpected values are not lost.
BRAKE_PRES_FR: src=CAN1, id=EF, bit=16, size=16, byte_order=LE, data_type=UINT, scale=-0.015, offset=480, range_min=0, range_max=200, param_type=FLOAT, unit="bar", log=ON
BRAKE_PRES_RR: src=CAN1, id=EF, bit=40, size=16, byte_order=LE, data_type=UINT, scale=-0.015, offset=480, range_min=0, range_max=200, param_type=FLOAT, unit="bar", log=ON
ENG_TORQUE: src=CAN1, id=A5, bit=16, size=12, byte_order=LE, data_type=UINT, scale=0.5, offset=-1023.5, range_min=-50, range_max=400, param_type=FLOAT, unit="Nm", log=ON
GEAR_TEMP: src=CAN1, id=39A, bit=8, size=8, byte_order=LE, data_type=UINT, scale=1, offset=-40, range_min=-40, range_max=170, param_type=FLOAT, unit="degC", log=ON
GEAR_SLOW: src=CAN1, id=3F9, bit=48, size=8, byte_order=LE, data_type=UINT, scale=1, offset=-4, range_min=-3, range_max=8, param_type=INT, unit="", log=ON

# Candidate mapping from supplied G8x/Supra maps. Verify on the F21 before use.
WHEEL_RL: src=CAN1, id=254, bit=0, size=16, byte_order=LE, data_type=UINT, scale=0.015625, offset=-511.984, range_min=-450, range_max=450, param_type=FLOAT, unit="rad_s", log=ON
WHEEL_RR: src=CAN1, id=254, bit=16, size=16, byte_order=LE, data_type=UINT, scale=0.015625, offset=-511.984, range_min=-450, range_max=450, param_type=FLOAT, unit="rad_s", log=ON
WHEEL_FL: src=CAN1, id=254, bit=32, size=16, byte_order=LE, data_type=UINT, scale=0.015625, offset=-511.984, range_min=-450, range_max=450, param_type=FLOAT, unit="rad_s", log=ON
WHEEL_FR: src=CAN1, id=254, bit=48, size=16, byte_order=LE, data_type=UINT, scale=0.015625, offset=-511.984, range_min=-450, range_max=450, param_type=FLOAT, unit="rad_s", log=ON
ACCEL_LONG: src=CAN1, id=199, bit=16, size=16, byte_order=LE, data_type=UINT, scale=0.002, offset=-65, range_min=-20, range_max=20, param_type=FLOAT, unit="m_s2", log=ON
ACCEL_LAT: src=CAN1, id=19A, bit=16, size=16, byte_order=LE, data_type=UINT, scale=0.002, offset=-65, range_min=-20, range_max=20, param_type=FLOAT, unit="m_s2", log=ON

FTU_LEFT: src=D1, scale=1, offset=0, range_min=0, range_max=1, param_type=BOOL, unit="", log=ON
FTU_RIGHT: src=D2, scale=1, offset=0, range_min=0, range_max=1, param_type=BOOL, unit="", log=ON

[RACECHRONO BLE]
RPM: id=01, start_byte=0, size_bytes=2, data_type=INT, period=20
THROTTLE: id=01, start_byte=2, size_bytes=2, data_type=INT, period=20
SW_ANGLE: id=01, start_byte=4, size_bytes=4, data_type=FLOAT, period=20
# RaceChrono: this is only a binary brake-on marker.
BRAKE_PED: id=01, start_byte=8, size_bytes=1, data_type=INT, period=20
# Use these as Brake pressure, not Brake position (%), in RaceChrono.
BRAKE_PRES_FR: id=01, start_byte=9, size_bytes=2, data_type=INT, period=20
BRAKE_PRES_RR: id=01, start_byte=11, size_bytes=2, data_type=INT, period=20
ENG_TORQUE: id=01, start_byte=13, size_bytes=2, data_type=INT, period=20
GEAR_SLOW: id=01, start_byte=15, size_bytes=1, data_type=INT, period=20

BATTERY: id=02, start_byte=0, size_bytes=4, data_type=FLOAT, period=1000
COOLANT_TEMP: id=02, start_byte=4, size_bytes=2, data_type=INT, period=1000
OIL_TEMP: id=02, start_byte=6, size_bytes=2, data_type=INT, period=1000
GEAR_TEMP: id=02, start_byte=8, size_bytes=2, data_type=INT, period=1000
AIR_TEMP: id=02, start_byte=10, size_bytes=2, data_type=INT, period=1000

# Packet 0x03 is a 50 Hz, 16-byte payload of four IEEE-754 floats in rad/s.
WHEEL_RL: id=03, start_byte=0, size_bytes=4, data_type=FLOAT, period=20
WHEEL_RR: id=03, start_byte=4, size_bytes=4, data_type=FLOAT, period=20
WHEEL_FL: id=03, start_byte=8, size_bytes=4, data_type=FLOAT, period=20
WHEEL_FR: id=03, start_byte=12, size_bytes=4, data_type=FLOAT, period=20

# Candidate F21 accelerations: 50 Hz, sent to RaceChrono in m/s².
ACCEL_LONG: id=04, start_byte=0, size_bytes=4, data_type=FLOAT, period=20
ACCEL_LAT: id=04, start_byte=4, size_bytes=4, data_type=FLOAT, period=20
