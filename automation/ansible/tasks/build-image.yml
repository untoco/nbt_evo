---
- name: Build general development image
  ansible.builtin.command:
    argv: [tools/nbt-dev/run, build]
    chdir: "{{ repo_root }}"
  environment:
    NBT_DEV_IMAGE: "{{ nbt_dev_image }}"
  changed_when: true
  when: image_result.item.component == 'dev'

- name: Cache pinned QNX base image
  ansible.builtin.command:
    argv:
      - docker
      - pull
      - --platform
      - linux/arm64
      - "{{ (lookup('ansible.builtin.file', repo_root ~ '/tools/nbt-dev/dependencies-arm64.json') | from_json).base_image }}"
  changed_when: false
  when: image_result.item.component == 'qnx'

- name: Build QNX compiler image
  ansible.builtin.command:
    argv: [tools/nbt-dev/qnx-run, build]
    chdir: "{{ repo_root }}"
  environment:
    NBT_QNX_IMAGE: "{{ nbt_qnx_image }}"
    NBT_QNX_PLATFORM: linux/arm64
  changed_when: true
  when: image_result.item.component == 'qnx'

- name: Build reverse engineering image
  ansible.builtin.command:
    argv: ["{{ nbt_python }}", tools/nbt_re.py, build]
    chdir: "{{ repo_root }}"
  changed_when: true
  when: image_result.item.component == 're'
