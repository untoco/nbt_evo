---
- name: Verify predownloaded resources without network access
  ansible.builtin.command:
    argv: "{{ [nbt_python, 'tools/nbt_fetch.py', 'check', '--components'] + nbt_components }}"
    chdir: "{{ repo_root }}"
  changed_when: false
  when: not nbt_offline

- name: Build requested images when missing or explicitly rebuilding
  ansible.builtin.include_tasks: build-image.yml
  loop: "{{ initial_images.results }}"
  loop_control:
    loop_var: image_result
    label: "{{ image_result.item.component }}"
  when:
    - not nbt_offline
    - image_result.rc != 0 or nbt_rebuild
